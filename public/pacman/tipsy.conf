# Tipsy official Arch Linux repository (stable).
#
# Added automatically by install.sh, or manually:
#   sudo curl -fsSL -o /etc/pacman.d/tipsy.conf \
#     https://32bitx64bit.github.io/Tipsy-repo/pacman/tipsy.conf
#   echo 'Include = /etc/pacman.d/tipsy.conf' | sudo tee -a /etc/pacman.conf
#   sudo pacman -Sy && sudo pacman -S tipsy
#
# The signing key must be trusted in the pacman keyring first; see
# https://github.com/32bitx64bit/Tipsy-repo/blob/main/docs/INSTALL.md
[tipsy]
SigLevel = Required DatabaseOptional
Server = https://32bitx64bit.github.io/Tipsy-repo/pacman/$arch
